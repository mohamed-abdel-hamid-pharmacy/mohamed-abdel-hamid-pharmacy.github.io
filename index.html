<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تواصل معنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132024;
    --ink-soft:#5b6a70;
    --paper:#F6F4EF;
    --panel:#FFFFFF;
    --line:#E7E2D8;
    --navy-1:#0E3B43;
    --navy-2:#123A5C;
    --gold:#C9A24B;
    --pay:#7B2FF7;
    --pay-bg:#F4EEFD;
    --fb:#1877F2;
    --fb-bg:#EAF2FE;
    --wa:#1FA855;
    --wa-bg:#EAF8EF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 85% -10%, rgba(201,162,75,0.16), transparent 42%),
      radial-gradient(circle at -10% 15%, rgba(14,59,67,0.10), transparent 40%),
      var(--paper);
    min-height:100vh;
    font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px calc(32px + env(safe-area-inset-bottom));
  }
  .sheet{
    width:100%;
    max-width:420px;
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .crest{
    width:44px; height:3px; border-radius:3px;
    background:var(--gold);
    margin:0 auto 22px;
  }
  h1{
    font-family:"Noto Kufi Arabic",sans-serif;
    font-weight:900;
    font-size:28px;
    line-height:1.3;
    text-align:center;
    margin:0 0 8px;
    color:var(--navy-2);
  }
  p.lede{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    margin:0 0 30px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.card{
    --accent: var(--ink);
    --accent-bg: var(--paper);
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(20,30,40,0.04);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.card::before{
    content:"";
    position:absolute;
    inset-inline-end:0;
    top:0; bottom:0;
    width:4px;
    background:var(--accent);
  }
  a.card:active{
    transform:scale(.97);
  }
  a.card:hover{
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(20,30,40,0.08);
  }
  .badge{
    flex:0 0 auto;
    width:50px; height:50px;
    border-radius:14px;
    background:var(--accent-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .badge svg{width:26px; height:26px;}
  .txt{flex:1; min-width:0;}
  .txt .main{
    font-family:"Noto Kufi Arabic",sans-serif;
    font-weight:700;
    font-size:17px;
    display:block;
  }
  .txt .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:2px;
    direction:ltr;
    text-align:right;
    font-family:"Noto Sans Arabic",sans-serif;
  }
  .go{
    flex:0 0 auto;
    color:var(--accent);
    opacity:.55;
  }
  .pay{ --accent:var(--pay); --accent-bg:var(--pay-bg); }
  .fb { --accent:var(--fb);  --accent-bg:var(--fb-bg); }
  .wa { --accent:var(--wa);  --accent-bg:var(--wa-bg); }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12.5px;
    color:#9aa3a7;
  }
  @media (prefers-reduced-motion: reduce){
    .sheet{animation:none;}
    a.card{transition:none;}
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="crest"></div>
    <h1>تواصل معنا</h1>
    <p class="lede">اختر الطريقة المناسبة لك</p>

    <div class="links">
      <a class="card pay" href="https://ipn.eg/S/fatmayounes3914/instapay/9OCQBA" target="_blank" rel="noopener">
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7B2FF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5.5" width="19" height="13" rx="2.4"/>
            <line x1="2.5" y1="10" x2="21.5" y2="10"/>
            <circle cx="7" cy="15" r="1.15" fill="#7B2FF7" stroke="none"/>
          </svg>
        </span>
        <span class="txt">
          <span class="main">ادفع عبر إنستاباي</span>
          <span class="sub">Pay via InstaPay</span>
        </span>
        <span class="go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6"/></svg>
        </span>
      </a>

      <a class="card fb" href="https://www.facebook.com/share/1C3q86AGtX/?mibextid=wwXIfr" target="_blank" rel="noopener">
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1877F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="6.2" r="2.4"/>
            <circle cx="5.3" cy="16.4" r="2.4"/>
            <circle cx="18.7" cy="16.4" r="2.4"/>
            <line x1="10.5" y1="8" x2="6.7" y2="14.4"/>
            <line x1="13.5" y1="8" x2="17.3" y2="14.4"/>
          </svg>
        </span>
        <span class="txt">
          <span class="main">تابعنا على فيسبوك</span>
          <span class="sub">Follow us on Facebook</span>
        </span>
        <span class="go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6"/></svg>
        </span>
      </a>

      <a class="card wa" href="https://wa.me/201031730035" target="_blank" rel="noopener">
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1FA855" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20l1.3-3.9A7.6 7.6 0 1 1 8.8 19L4 20z"/>
            <circle cx="9.3" cy="11.3" r="0.9" fill="#1FA855" stroke="none"/>
            <circle cx="12.6" cy="11.3" r="0.9" fill="#1FA855" stroke="none"/>
            <circle cx="15.9" cy="11.3" r="0.9" fill="#1FA855" stroke="none"/>
          </svg>
        </span>
        <span class="txt">
          <span class="main">تواصل معنا عبر واتساب</span>
          <span class="sub">Contact us on WhatsApp</span>
        </span>
        <span class="go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6"/></svg>
        </span>
      </a>
    </div>

    <footer>اضغط على أي رابط لفتحه مباشرة</footer>
  </div>
</body>
</html>
